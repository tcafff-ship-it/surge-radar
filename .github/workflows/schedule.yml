name: 🚕 運將接單雷達自動更新

on:
  schedule:
    - cron: '0 19 * * *' 
  workflow_dispatch: # 讓你可以隨時手動點擊「立即執行」

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 下載最新程式碼
      uses: actions/checkout@v3

    - name: 🐍 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 安裝抓網頁裝備 (requirements.txt)
      run: |
        pip install -r requirements.txt

    - name: 🚀 啟動雷達引擎 (執行 scraper.py)
      run: |
        python scraper.py

    - name: 🌐 發布行事曆到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        keep_files: false

